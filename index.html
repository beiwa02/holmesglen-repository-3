<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie List</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>&#127871 My Favourite Movies &#127871</h1>
  </header>

  <!-- Sidebar and movie array -->
  <div class="flex-row">

    <!-- Sidebar -->
    <div class="flex-column" id="sidebar">

      <!-- Sort -->
      <div class="sidebar-sec" id="sort">
        <h3>Sort</h3>

        <!-- Sorting buttons -->
         <div class="flex-col" id="sort-buttons">
          <button type="button" name="sortA2Z" onclick="">Title (ascending)</button>
          <button type="button" name="sortZ2A" onclick="">Title (descending)</button>
          <button type="button" name="sortRating" onclick="">Rating (descending)</button>
          <button type="button" name="refresh" onclick="">Refresh</button>
        </div>
        <hr>
      </div>

      <!-- Search -->
      <div class="sidebar-sec" id="search">
        <h3>Search</h3>

        <!-- Search forms -->
        <div id="search-movie">

          <!-- Search by ID -->
          <form id="search-form-ID">
            <!-- Input -->
            <div class="form-div">
              <label for="search-ID"><h4>Search by ID</h4></label>
              <input type="text" placeholder="ID" name="ID" id="search-ID">
            </div>
            <!-- Submit -->
            <button type="button" name="submit" onclick="">Search</button>
          </form>

          <!-- Search by title -->
          <form id="search-form-title">
            <!-- Input -->
            <div class="form-div">
              <label for="search-title"><h4>Search by title</h4></label>
              <input type="text" placeholder="Title" name="title" id="search-title">
            </div>
            <!-- Submit -->
            <button type="button" name="submit" onclick="">Search</button>
          </form>
        </div>
        <hr>
      </div>

      <!-- Add movie -->
      <div class="sidebar-sec" id="add">
        <h3>Add movie</h3>
      </div>
    </div>

    <!-- Display movie list -->
    <div id="movie-list">
      <div id="list">
        <h2>Movie List</h2>
      </div>
    </div>
  </div>
  
</body>
</html>
